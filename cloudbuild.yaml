steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'
      - '.'

  # 2. Push image tags to Artifact Registry
  #    (gcr.io/Container Registry is deprecated; Artifact Registry is the
  #    supported GCP image store as of 2025.)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha-tag'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-tag'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_LOCATION}'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '4'
      - '--timeout'
      - '60'
      # App-level auth (real Google Workspace SSO) is the security gate.
      # The runtime service account must have the "Cloud Datastore User" role
      # for Firestore persistence (see docs/DEPLOYMENT_RUNBOOK.md).
      # NOTE: --update-env-vars (not --set-env-vars) so that variables set
      # outside this pipeline — e.g. GEMINI_API_KEY added via the console or
      # Secret Manager — are preserved across deploys instead of wiped.
      - '--update-env-vars'
      - 'ALLOWED_DOMAIN=${_ALLOWED_DOMAIN},DRIVE_FOLDER_ID=${_DRIVE_FOLDER_ID},ADMIN_EMAILS=${_ADMIN_EMAILS},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=${_USE_VERTEXAI},VERTEX_LOCATION=${_VERTEX_LOCATION},TFAN_AI_MODEL=${_TFAN_AI_MODEL},STORAGE_BACKEND=${_STORAGE_BACKEND}'

substitutions:
  _REPO_NAME: 'uad36-wiki'
  _SERVICE_NAME: 'uad36-wiki'
  _LOCATION: 'us-central1'
  _AR_REPO: 'uad36-wiki-repo'
  _ALLOWED_DOMAIN: 'truefootage.tech'
  _DRIVE_FOLDER_ID: '1E7_DywyR2785lgZCNs8ZfvYmFi10r-6F'
  _ADMIN_EMAILS: 'kevin.zelenakas@truefootage.tech'
  # Must be the Firebase project that issues the sign-in ID tokens.
  _FIREBASE_PROJECT_ID: 'uad-36-knowledge-base'
  # TFAN Q&A via Vertex AI Gemini (service-account auth, no API key).
  # Requires: Vertex AI API enabled + runtime SA has roles/aiplatform.user.
  _USE_VERTEXAI: 'true'
  _VERTEX_LOCATION: 'us-central1'
  # Force durable Firestore in prod — never silently use the ephemeral file
  # store (which resets every deploy and wiped documents/config).
  _STORAGE_BACKEND: 'firestore'
  # gemini-2.0-flash is RETIRED (EOL June 2026) — do not use it.
  # gemini-2.5-flash is the current GA Flash model on Vertex (confirmed GA
  # 2025-06-17). Note: scheduled to sunset 2026-10-16 — bump this to the next
  # GA Flash (e.g. gemini-3-flash once GA on your Vertex project) before then.
  _TFAN_AI_MODEL: 'gemini-2.5-flash'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
