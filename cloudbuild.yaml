steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:latest'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:latest'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:$COMMIT_SHA'
      - '--region'
      - '${_LOCATION}'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'

substitutions:
  _SERVICE_NAME: 'uad36-wiki'
  _LOCATION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${REPO_NAME:-uad36-wiki}:latest'

# ADD THIS SECTION TO FIX THE LOGGING ISSUE:
options:
  logging: CLOUD_LOGGING_ONLY
