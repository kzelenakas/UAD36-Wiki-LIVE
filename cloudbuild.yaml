steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'
      - '.'

  # 2. Push image tags to Artifact Registry
  #    (gcr.io/Container Registry is deprecated; Artifact Registry is the
  #    supported GCP image store as of 2025.)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha-tag'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-tag'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_LOCATION}'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '4'
      - '--timeout'
      - '60'
      # Restores Drive connection and removes Gemini Key
      - '--set-env-vars'
      - 'ALLOWED_DOMAIN=${_ALLOWED_DOMAIN},DRIVE_FOLDER_ID=1E7_DywyR2785lgZCNs8ZfvYmFi10r-6F'
      # This removes the existing GEMINI_API_KEY if it was previously set
      - '--update-env-vars'
      - 'ALLOWED_DOMAIN=${_ALLOWED_DOMAIN}'

substitutions:
  _REPO_NAME: 'uad36-wiki'
  _SERVICE_NAME: 'uad36-wiki'
  _LOCATION: 'us-central1'
  _AR_REPO: 'uad36-wiki-repo'
  _ALLOWED_DOMAIN: 'truefootage.tech'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:$COMMIT_SHA'
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_REPO_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
